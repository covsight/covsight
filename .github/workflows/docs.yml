name: Docs

on:
  push:
    branches: [main, master]   # build only -- the deploy job is gated below
    tags: ['v*']               # build + deploy
  workflow_dispatch:           # build + deploy, on demand

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ivpm and fetch dependencies
        run: pip install ivpm && ivpm update

      - name: Install covsight-core
        run: pip install -e "packages/covsight-core[validate,hjson]"

      - name: Install covsight
        run: pip install -e "."

      - name: Install doc dependencies
        run: pip install -r docs/requirements.txt

      - name: Build docs
        run: sphinx-build -b html docs/source docs/_build/html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

      # Plain artifact alongside the Pages one, named to the <org>-<repo>
      # convention the host-side dvkit.org docs poller consumes. Uploaded on
      # every build so the eventual dvkit.org/covsight/covsight/ path has a
      # source, independent of whether GitHub Pages is still in the picture.
      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-covsight-covsight
          path: docs/_build/html
          if-no-files-found: error

  deploy:
    # Publication is TAG-DRIVEN. See the note in covsight.github.io's
    # deploy.yml: Forgejo mirrors main to GitHub automatically, so a
    # branch-triggered deploy would republish docs as a side effect of a sync.
    # The build job still runs on every push; only the publish is gated.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
