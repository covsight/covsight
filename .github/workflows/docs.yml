name: Docs

# BUILD ONLY. This workflow does not publish anything, by design.
#
# Docs for every dvkit project are published by FORGEJO, not GitHub. The
# host-side poller (~/dvkit-docs/bin/docs-fetch) reads build artifacts from the
# Forgejo API, promotes them, and deploys with a Cloudflare token that never
# enters a job container. A Cloudflare Pages deployment replaces the WHOLE
# site, so dvkit.org is a single Pages space shared by every project -- there
# is exactly one publisher for it, and it is not here.
#
# What used to be here was a `deploy-pages` job. It was first converted from
# branch-driven to tag-driven (so a mirrored push could not republish as a side
# effect of a sync), and then removed outright: GitHub Pages would be a second,
# divergent copy of the docs, and the artifact this job used to upload for the
# poller was consumed by nothing, because the poller only ever looks at Forgejo.
#
# The Forgejo-side docs job that actually publishes lives in
# .forgejo/workflows/ and uploads `docs-covsight-covsight`.
#
# This job stays because a docs build that breaks should still fail a push.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ivpm and fetch dependencies
        run: pip install ivpm && ivpm update

      - name: Install covsight-core
        run: pip install -e "packages/covsight-core[validate,hjson]"

      - name: Install covsight
        run: pip install -e "."

      - name: Install doc dependencies
        run: pip install -r docs/requirements.txt

      - name: Build docs
        run: sphinx-build -b html docs/source docs/_build/html
