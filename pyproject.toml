[build-system]
requires = ["setuptools>=68.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "covsight"
dynamic = ["version"]
requires-python = ">=3.10"
description = "Coverage analysis CLI and tooling built on covsight-core"
license = "Apache-2.0"
dependencies = [
    "covsight-core>=0.2.0",
    "pyyaml>=5.1",
    "rich>=13.0",
]

[project.scripts]
covsight = "covsight.cli.main:main"

# Entry-points for report format plugins will be added in Milestone 8
[project.entry-points."covsight.formats.rpt"]
text = "covsight.analysis.report_text:TextReportPlugin"
json = "covsight.analysis.report_json:JsonReportPlugin"

# dv-flow package 'covsight' (tasks covsight.Import / covsight.Merge).
# __ext__ only returns file paths, so this is inert without dv-flow-mgr.
[project.entry-points."dv_flow.mgr"]
covsight = "covsight.dvflow.__ext__"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"covsight.dvflow" = ["*.yaml", "*.json"]

[tool.setuptools_scm]
root = "."

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]
dvflow = ["dv-flow-mgr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
