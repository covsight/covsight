package:
  name: covsight
  doc: |
    Coverage tasks backed by covsight. Import turns simulator coverage
    databases into covsight NCDB files (one per test, carrying the test's
    name, seed and verdict); Merge combines NCDB files.

    Inputs come from dv-flow-libhdlsim: a SimRunResult / TestResult /
    SuiteResult item's `simCovDb` artifacts, or a bare `simCovDb` FileSet.
    The reader is chosen from the FileSet's `format=` attribute
    (vlt-dat -> Verilator coverage.dat).

  tasks:
  - export: Import
    doc: Convert coverage databases to covsight NCDB (filetype covsightNCDB)
    pytask: covsight.dvflow.cov_import.Import
    uptodate: covsight.dvflow.cov_import.UpToDate
    consumes:
    - type: hdlsim.TestResult
    - type: hdlsim.SimRunResult
    - type: hdlsim.SuiteResult
    - filetype: simCovDb
    produces:
    - type: std.FileSet
      filetype: covsightNCDB
    with:
      test_name:
        doc: |
          Test name recorded in the database. Defaults to the case name from
          the TestResult/SimRunResult. With several inputs, `_<n>` is appended.
        type: str
        value: ""
      seed:
        doc: Seed recorded in the database (defaults to the run's seed)
        type: str
        value: ""
      status:
        doc: Test outcome recorded (pass/fail/error); defaults to the verdict
        type: str
        value: ""
      on_unsupported:
        doc: What to do with a database in an unsupported format (error/warn/skip)
        type: str
        value: "error"
      include_std:
        doc: Keep coverage of Verilator's built-in std package
        type: bool
        value: false

  - export: Merge
    doc: Merge covsightNCDB databases into a single NCDB
    pytask: covsight.dvflow.cov_merge.Merge
    consumes:
    - filetype: covsightNCDB
    produces:
    - type: std.FileSet
      filetype: covsightNCDB
    with:
      output:
        doc: Output file name, relative to the task's run directory
        type: str
        value: "merged.cdb"

  - export: Show
    doc: |
      Run covsight commands on a database and keep their output (one .txt per
      command, plus transcript.json listing them), e.g. for the docs.
    pytask: covsight.dvflow.cov_show.Show
    consumes:
    - filetype: covsightNCDB
    produces:
    - type: std.FileSet
      filetype: covsightTranscript
    with:
      commands:
        doc: |
          covsight commands without the database, e.g. "show code-coverage
          -of text". The database goes after the subcommand words, or in
          place of "{db}".
        type: list
        value: []
      expect:
        doc: |
          expect.yaml whose `transcript` list is used when `commands` is
          empty (relative to the flow's directory)
        type: str
        value: ""

  - export: Check
    doc: |
      Check a coverage run against expect.yaml: per-kind totals, parity with
      verilator_coverage, and the expected Verilator build warnings.
      Fails with one marker per difference; writes check.json.
    pytask: covsight.dvflow.cov_check.Check
    consumes:
    - filetype: covsightNCDB
    - filetype: simCovDb
    - filetype: simDir
    - type: hdlsim.TestResult
    - type: hdlsim.SimRunResult
    - type: hdlsim.SuiteResult
    with:
      expect:
        doc: Path to expect.yaml, relative to the flow's directory
        type: str
        value: "expect.yaml"
      parity:
        doc: Compare with verilator_coverage --report summary (needs coverage.dat inputs)
        type: bool
        value: true
      include_std:
        doc: Set when covsight.Import kept Verilator's std package (include_std)
        type: bool
        value: false
